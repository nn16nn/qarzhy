<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qarzhy</title>
<meta name="theme-color" content="#EFECE4" id="meta-theme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-apple.png">
<style>
@font-face{font-family:Onest;src:url(fonts/onest-cyrillic-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;src:url(fonts/onest-cyrillic-ext-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
@font-face{font-family:Onest;src:url(fonts/onest-latin-ext-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Onest;src:url(fonts/onest-latin-wght-normal.woff2) format('woff2');font-weight:100 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Serif;src:url(fonts/cormorant-700.woff2) format('woff2');font-weight:700}

:root{
  --bg:#EFECE4; --sf:#FAF8F3; --sf2:#E5E1D6; --ink:#141412; --mute:#6F6C64; --line:#DCD7CB;
  --lime:#D2F45C; --lime-ink:#141412;
  --hero:#141412; --hero-ink:#F4F1E8; --hero-mute:#9C998F; --hero-line:#2B2B27;
  --pos:#138A5B; --neg:#D2452D; --warn:#C98A0B;
  --r:22px; --r2:16px; --r3:12px;
  --sh:0 1px 0 rgba(20,20,18,.04),0 8px 24px -14px rgba(20,20,18,.18);
  --dock:#141412; --dock-ink:#F4F1E8;
  color-scheme:light;
}
html.dark{
  --bg:#0C0C0B; --sf:#171715; --sf2:#22221F; --ink:#F1EEE6; --mute:#8F8C84; --line:#2A2A26;
  --hero:#D2F45C; --hero-ink:#141412; --hero-mute:#4E5A22; --hero-line:rgba(20,20,18,.14);
  --pos:#4FD08F; --neg:#FF6B52; --warn:#F2B53A;
  --sh:0 1px 0 rgba(255,255,255,.02),0 10px 30px -16px rgba(0,0,0,.6);
  --dock:#1D1D1A; --dock-ink:#F1EEE6;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 15px/1.4 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{-webkit-appearance:none;appearance:none}
.num,.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}

#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.page{display:none;animation:pgIn .28s cubic-bezier(.2,.8,.2,1)}
.page.on{display:block}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ----- шапка ----- */
.top{display:flex;align-items:center;gap:10px;min-height:52px;margin-bottom:8px}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:0;flex:1;line-height:1.1}
.top .sub{display:block;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:2px}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sf);box-shadow:var(--sh);flex:none}
.ibtn:active{transform:scale(.94)}
.mark{font-family:Serif,serif;font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1;flex:1;display:flex;align-items:center;gap:2px}
.mark i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-left:3px;transform:translateY(5px);box-shadow:0 0 0 1.5px var(--ink)}

/* ----- hero ----- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:1px solid var(--hero-line);box-shadow:0 0 0 28px transparent,inset 0 0 0 28px transparent}
.hero::before{content:"";position:absolute;right:-20px;top:-30px;width:140px;height:140px;border-radius:50%;border:1px solid var(--hero-line)}
.hero .lab{font-size:13px;color:var(--hero-mute);font-weight:500;display:flex;align-items:center;gap:8px}
.hero .big{font-size:40px;font-weight:650;letter-spacing:-.045em;line-height:1.05;margin:6px 0 16px;position:relative;z-index:1}
.hero .big small{font-size:22px;color:var(--hero-mute);font-weight:500;margin-left:4px}
.hero .hrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;z-index:1}
.hero .cell{border:1px solid var(--hero-line);border-radius:16px;padding:10px 12px;text-align:left}
.hero .cell span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hero-mute)}
.hero .cell b{display:block;font-size:17px;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--lime);color:var(--lime-ink);font-size:12px;font-weight:600}
html.dark .hero .pill{background:var(--hero-ink);color:var(--hero)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* ----- жылдам әрекеттер ----- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.quick button{background:var(--sf);border-radius:20px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:550;box-shadow:var(--sh)}
.quick button .q{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--sf2)}
.quick button:first-child .q{background:var(--lime);color:var(--lime-ink)}
.quick button:active{transform:scale(.96)}

/* ----- карталар ----- */
.card{background:var(--sf);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-top:12px}
.card h2,.sec{font-size:15px;font-weight:650;margin:0 0 10px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h2 .more,.sec .more{margin-left:auto;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:2px}
.sec{margin:22px 4px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{background:var(--sf);border-radius:20px;padding:14px;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;gap:12px;min-height:104px}
.tile .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--sf2)}
.tile b{font-size:14px;font-weight:600;display:block}
.tile span{font-size:12.5px;color:var(--mute);display:block;margin-top:1px}
.tile:active{transform:scale(.97)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3>div{background:var(--sf2);border-radius:14px;padding:10px}
.stat3 span{display:block;font-size:11.5px;color:var(--mute)}
.stat3 b{display:block;font-size:15px;font-weight:650;margin-top:2px;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mute)}
.kv b{font-weight:600;text-align:right}
.muted{color:var(--mute)}
.pos{color:var(--pos)!important}.neg{color:var(--neg)!important}
.empty{padding:26px 10px;text-align:center;color:var(--mute);font-size:14px}
.empty svg.i{width:30px;height:30px;display:block;margin:0 auto 8px;opacity:.6}

/* ----- тізім ----- */
.list{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.day{font-size:12.5px;font-weight:600;color:var(--mute);padding:14px 6px 6px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;background:var(--sf);position:relative}
.row+.row{border-top:1px solid var(--line)}
.ci{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.row .ci svg.i{width:19px;height:19px}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:550;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid span{display:block;font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;font-size:15px;text-align:right;letter-spacing:-.01em}
.row .amt small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.row:active{background:var(--sf2)}
.bank{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;overflow:hidden}
.bank img{width:100%;height:100%;object-fit:contain;padding:4px}
.prog{height:6px;border-radius:9px;background:var(--sf2);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:9px;background:var(--ink)}
html.dark .prog i{background:var(--lime)}
.swipe{position:relative;overflow:hidden}
.swipe .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600}
.swipe .under .l{color:var(--ink)}.swipe .under .r{color:#fff}
.swipe.del .under{background:var(--neg)}.swipe.ed .under{background:var(--lime)}
.swipe .row{transition:transform .2s;touch-action:pan-y}

/* ----- сегмент, чиптер ----- */
.seg{display:flex;background:var(--sf2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:13.5px;font-weight:550;color:var(--mute);transition:.15s}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:99px;background:var(--sf);font-size:13px;font-weight:550;white-space:nowrap;box-shadow:var(--sh);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:14px;font-size:11.5px;font-weight:500;text-align:center;line-height:1.15;border:1.5px solid transparent}
.cat .ci{width:38px;height:38px;border-radius:13px;display:grid;place-items:center}
.cat.on{border-color:var(--ink);background:var(--sf2)}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border-radius:16px;padding:0 14px;box-shadow:var(--sh);margin-bottom:10px}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none;font-size:15px}

/* ----- форма ----- */
.f{display:block;margin-top:12px}
.f>span{display:block;font-size:12.5px;font-weight:550;color:var(--mute);margin:0 0 6px 2px}
.in{width:100%;background:var(--sf2);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--ink)}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.amtbox{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 4px}
.amtbox input{border:0;background:none;outline:none;font-size:46px;font-weight:650;letter-spacing:-.04em;text-align:right;max-width:80%;min-width:0;padding:0;font-variant-numeric:tabular-nums}
.amtbox span{font-size:28px;color:var(--mute);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:650;font-size:15.5px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.red{background:transparent;color:var(--neg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:10px 14px;font-size:13.5px;margin-top:0;width:auto;border-radius:12px}
.btn:active{transform:scale(.98)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.sw{width:46px;height:28px;border-radius:99px;background:var(--sf2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--ink)}.sw.on::after{left:21px}
html.dark .sw.on{background:var(--lime)}html.dark .sw.on::after{background:#141412}

/* ----- док ----- */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(92vw,420px);height:66px;background:var(--dock);color:var(--dock-ink);border-radius:24px;display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center;z-index:20;box-shadow:0 14px 40px -12px rgba(0,0,0,.45)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:550;opacity:.55;transition:.15s}
.dock button.on{opacity:1}
.dock button.on svg.i{color:var(--lime)}
.dock .add{opacity:1;width:52px;height:52px;margin:0 auto;border-radius:18px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center}
.dock .add svg.i{width:26px;height:26px;stroke-width:2.2;color:var(--lime-ink)!important}
.dock .add:active{transform:scale(.92)}

/* ----- парақ (sheet) ----- */
.veil{position:fixed;inset:0;background:rgba(10,10,9,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.veil.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 22px);z-index:41;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s;overscroll-behavior:contain}
.sheet.on{transform:translate(-50%,0);visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px;display:flex;align-items:center;gap:10px}
.sheet h3 .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--sf2);display:grid;place-items:center}
.sheet .in{background:var(--bg)}
html.dark .sheet .in{background:var(--sf2)}

/* ----- статистика ----- */
.monnav{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border-radius:16px;padding:6px;box-shadow:var(--sh)}
.monnav b{font-weight:600;font-size:15px}
.monnav button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sf2)}
.donut{display:grid;place-items:center;position:relative;margin:6px auto 4px;width:220px;height:220px}
.donut svg{width:220px;height:220px;transform:rotate(-90deg)}
.donut .c{position:absolute;text-align:center}
.donut .c span{font-size:12.5px;color:var(--mute);display:block}
.donut .c b{font-size:24px;font-weight:650;letter-spacing:-.03em}
.donut circle{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.bars .pair i{width:12px;border-radius:5px 5px 3px 3px;display:block;min-height:3px;transition:height .5s}
.bars .pair i.a{background:var(--pos)}
.bars .pair i.b{background:var(--ink)}
html.dark .bars .pair i.b{background:var(--lime)}
.bars span{font-size:11px;color:var(--mute)}
.bars>div.on span{color:var(--ink);font-weight:650}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}

/* ----- кесте ----- */
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{color:var(--mute);font-weight:550;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
.scrollx{overflow-x:auto;max-height:340px;overflow-y:auto}
.result{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:16px;margin-top:12px}
.result span{color:var(--hero-mute);font-size:12.5px;display:block}
.result b{font-size:28px;font-weight:650;letter-spacing:-.03em;display:block;margin:2px 0 10px}
.result .stat3>div{background:transparent;border:1px solid var(--hero-line)}
.result .stat3 span{color:var(--hero-mute)}
.result .stat3 b{font-size:15px;margin:2px 0 0;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .stat3>div{min-width:0}

/* ----- импорт ----- */
.imp-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.imp-row input[type=checkbox]{appearance:auto;-webkit-appearance:auto;width:20px;height:20px;accent-color:var(--ink);flex:none}
.imp-row .mid{flex:1;min-width:0}
.imp-row .mid b{display:block;font-size:13.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row .mid span{font-size:12px;color:var(--mute)}
.imp-row.off{opacity:.45}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:7px;background:var(--sf2);color:var(--mute)}
.drop{border:1.5px dashed var(--line);border-radius:20px;padding:28px 16px;text-align:center;display:block;cursor:pointer}
.drop b{display:block;font-size:15px;margin:8px 0 4px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sf2);border-top-color:var(--ink);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ----- растау терезесі ----- */
#dlg{position:fixed;inset:0;background:rgba(10,10,9,.5);display:none;place-items:center;z-index:70;padding:24px}
.dlg-box{background:var(--sf);border-radius:24px;padding:20px;max-width:360px;width:100%}
.dlg-box p{margin:0 0 4px;font-size:15.5px;line-height:1.45;font-weight:500}
/* ----- тост ----- */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:550;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;display:flex;gap:12px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--lime);font-weight:700}
html.dark #toast button{color:#2a4a00}

/* ----- ашылу экраны ----- */
#splash{position:fixed;inset:0;background:#141412;display:grid;place-items:center;z-index:100;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash .m{font-family:Serif,serif;font-weight:700;font-size:56px;color:#F4F1E8;display:flex;align-items:center;animation:spl .7s cubic-bezier(.2,.8,.2,1)}
#splash .m i{width:13px;height:13px;border-radius:50%;background:#D2F45C;margin-left:5px;transform:translateY(9px)}
@keyframes spl{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

/* ===== 2.3 · микро-анимациялар ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1)}
/* док: жылжитын лайм пилюля */
.dock{overflow:visible}
.dock .pill{position:absolute;top:13px;width:52px;height:40px;border-radius:14px;background:var(--lime);transition:left .42s var(--spring),opacity .2s;pointer-events:none;z-index:0}
.dock button{position:relative;z-index:1;height:100%;justify-content:center}
.dock button svg.i{width:23px;height:23px}
.dock button.on{opacity:1}
.dock button.on svg.i{color:#141412!important}
.dock button.on.pop svg.i{animation:icPop .45s var(--spring)}
@keyframes icPop{0%{transform:scale(.7) translateY(2px)}60%{transform:scale(1.12) translateY(-1px)}100%{transform:none}}
/* сегмент: жылжитын бегунок */
.seg{position:relative}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:11px;background:var(--sf);box-shadow:0 1px 3px rgba(0,0,0,.1);transition:left .38s var(--spring),width .38s var(--spring);z-index:0}
.seg.has-thumb button{position:relative;z-index:1;background:transparent!important;box-shadow:none!important}
html.dark .seg .thumb{background:#34342f}
/* апта жолағы */
.week{display:flex;gap:4px;background:var(--sf2);border-radius:16px;padding:4px;position:relative}
.week button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:12px;font-size:11px;color:var(--mute);font-weight:550;position:relative;z-index:1;transition:color .25s}
.week button b{font-size:16px;color:var(--ink);font-weight:650;letter-spacing:-.02em}
.week button.on,.week button.on b{color:var(--lime-ink)}
.week .thumb{position:absolute;top:4px;bottom:4px;border-radius:12px;background:var(--lime);transition:left .4s var(--spring),width .4s var(--spring);z-index:0}
.week .cal{flex:0 0 40px}
.week .cal svg.i{width:18px;height:18px;margin-top:6px;color:var(--ink)}
/* диалог: кіру және шығу */
#dlg{opacity:0;transition:opacity .2s}
#dlg.on{opacity:1;animation:none}
#dlg .dlg-box{transform:scale(.9) translateY(10px);opacity:0;transition:transform .38s var(--spring),opacity .2s}
#dlg.on .dlg-box{transform:none;opacity:1}
#dlg.out{opacity:0}
#dlg.out .dlg-box{transform:scale(.96) translateY(6px);opacity:0;transition:transform .18s ease-in,opacity .18s}
/* «сақталды» түймесі */
.btn.ok{background:var(--lime)!important;color:#141412!important;pointer-events:none}
.btn .chk{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.btn .chk path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .35s .05s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.btn.ok{animation:okPop .4s var(--spring)}
@keyframes okPop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
/* жаңа жолды белгілеу */
.row.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,25%{background:color-mix(in srgb,var(--lime) 55%,var(--sf))}100%{background:var(--sf)}}
/* санат/чип таңдау */
.cat.on .ci{animation:pop .4s var(--spring)}
.chip.on{animation:pop .35s var(--spring)}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.06)}100%{transform:none}}
/* ай ауыстыру — бет жылжуы */
.slide-l{animation:slL .36s var(--ease)}.slide-r{animation:slR .36s var(--ease)}
@keyframes slL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.monnav b{display:inline-block}
/* парақ: серпімді ашылу */
.sheet{transition:transform .42s var(--spring),visibility .42s}
.sheet:not(.on){transition:transform .26s ease-in,visibility .26s}
#sheet-body>*{animation:none}
.sheet.on:not(.still) #sheet-body>*{animation:stg .4s var(--ease) both}
.sheet.on #sheet-body>*:nth-child(2){animation-delay:.03s}.sheet.on #sheet-body>*:nth-child(3){animation-delay:.06s}
.sheet.on #sheet-body>*:nth-child(4){animation-delay:.09s}.sheet.on #sheet-body>*:nth-child(n+5){animation-delay:.12s}
@keyframes stg{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* тост: серпімді */
#toast{transition:transform .38s var(--spring),opacity .2s}
/* басу сезімі */
.row,.tile,.quick button,.chip,.cat,.btn,.ibtn{transition:transform .15s var(--ease),background .2s}
.row:active{transform:scale(.985)}

/* ===== + мәзірі: желпуіш ===== */
#fan{position:fixed;inset:0;z-index:19;pointer-events:none}
#fan.on{pointer-events:auto}
.fan-veil{position:absolute;inset:0;background:rgba(10,10,9,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
#fan.on .fan-veil{opacity:1}
.fan-b{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 45px);width:64px;margin-left:-32px;display:flex;flex-direction:column;align-items:center;gap:6px;
  transform:translate(0,0) scale(.3);opacity:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .18s;transition-delay:calc((3 - var(--i)) * 18ms)}
#fan.on .fan-b{opacity:1;transform:translate(var(--x),var(--y)) scale(1);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .2s;transition-delay:calc(var(--i) * 40ms)}
.fan-ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--sf);color:var(--ink);box-shadow:0 10px 26px -8px rgba(0,0,0,.45)}
.fan-b:first-child+.fan-b .fan-ic,.fan-b:nth-of-type(1) .fan-ic{background:var(--lime);color:#141412}
.fan-ic svg.i{width:24px;height:24px}
.fan-t{font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.fan-b:active .fan-ic{transform:scale(.92)}
.dock .add svg.i{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.dock .add.open svg.i{transform:rotate(135deg)}
.dock .add.open{background:var(--sf);color:var(--ink)}
.dock .add.open svg.i{color:var(--ink)!important}
/* жалақы бөлу жолдары */
.spl{background:var(--sf2);border-radius:16px;padding:10px 10px 12px 14px;margin-top:8px}
.spl-top{display:flex;align-items:center;gap:10px}
.spl-top .dot{width:10px;height:10px}
.spl-name{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15.5px;font-weight:600;padding:6px 0;border-bottom:1.5px solid transparent}
.spl-name:focus{border-bottom-color:var(--ink)}
.spl-top b{font-size:15px;font-weight:650;white-space:nowrap}
.spl-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.spl-x svg.i{width:16px;height:16px}
.spl-bot{display:flex;align-items:center;gap:12px;margin-top:6px}
.spl-bot input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:9px;background:var(--line);accent-color:var(--c);outline:none}
.spl-bot input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--c);border:3px solid var(--sf);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.spl-bot input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid var(--sf)}
.spl-pct{display:flex;align-items:center;background:var(--sf);border-radius:10px;padding:0 10px;height:36px;flex:none}
.spl-pct input{width:34px;border:0;background:none;outline:none;text-align:right;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;padding:0}
.spl-pct span{color:var(--mute);font-size:14px;margin-left:2px}
/* ===== 2.5 ===== */
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:14px;line-height:1.4;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0}
.ins-ic{width:30px;height:30px;border-radius:10px;background:var(--sf2);display:grid;place-items:center;flex:none}
.ins-ic svg.i{width:16px;height:16px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat>i{font-style:normal;font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px}
.hc{aspect-ratio:1;border-radius:9px;font-size:12px;font-weight:600;display:grid;place-items:center;background:var(--sf2);color:var(--mute);padding:0}
.hc.l1{background:color-mix(in srgb,var(--lime) 30%,var(--sf2));color:var(--ink)}
.hc.l2{background:color-mix(in srgb,var(--lime) 65%,var(--sf2));color:#141412}
.hc.l3{background:var(--lime);color:#141412}
.hc.l4{background:var(--ink);color:var(--lime)}
.hc.td{box-shadow:inset 0 0 0 2px var(--ink)}
.hc:disabled{cursor:default}
.legend .hc{display:inline-block}
svg.nw{width:100%;height:auto;display:block;overflow:visible}
svg.nw text{font-size:10px;fill:var(--mute);font-family:Onest}
.nw-line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:nwDraw 1.1s var(--ease) forwards}
@keyframes nwDraw{to{stroke-dashoffset:0}}
.yr-n{width:22px;font-size:13px;color:var(--mute);flex:none}
.yr-v{font-size:17px;letter-spacing:-.02em;display:block;margin-top:2px}
.yr-v small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.hero.yr .big{font-size:44px}
html.dark .hc.l4{background:#F1EEE6;color:#141412}
.row.wrap .mid b,.row.wrap .mid span{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.kv b{min-width:0;white-space:normal;overflow-wrap:anywhere}
#app{overflow-x:clip}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="m">qarzhy<i></i></div></div>
<main id="app">
  <section class="page" id="p-home"></section>
  <section class="page" id="p-accounts"></section>
  <section class="page" id="p-stats"></section>
  <section class="page" id="p-more"></section>
  <section class="page" id="p-ops"></section>
  <section class="page" id="p-goals"></section>
  <section class="page" id="p-debts"></section>
  <section class="page" id="p-recur"></section>
  <section class="page" id="p-calc"></section>
  <section class="page" id="p-import"></section>
  <section class="page" id="p-year"></section>
  <section class="page" id="p-pension"></section>
</main>
<div id="fan"></div>
<nav class="dock" id="dock"></nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div id="toast"></div>
<div id="dlg"></div>
<input type="file" id="file-backup" accept=".json,application/json" class="hide">

<script src="i18n.js?v=2.5.5"></script>
<script src="parse.js?v=2.5.5"></script>

<script src="tools.js?v=2.5.5"></script>
<script src="features.js?v=2.5.5"></script>
</body>
